<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="./add.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="cart">

    <div class="top">
        <h2>Your Cart • 6</h2>
        <i class="fa-solid fa-xmark"></i>
    </div>

    <div class="products">

        <div class="item">
            <img src="https://floreal.in/cdn/shop/files/11_1_11zon_1.webp?v=1781940975&width=600" height="200" width="200">
            <div class="details">
                <h3>Floreal Bundle of Sunshine</h3>

                <div class="qty">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <p class="price">
                    Rs.1199.00
                    <span class="line">Rs.1499.00</span>
                </p>
            </div>

            <i class="fa-solid fa-trash"></i>
        </div>

        <div class="item">
            <img src="https://floreal.in/cdn/shop/files/21_converted_11zon.webp?v=1776938263&width=600" height="200" width="200">
            <div class="details">
                <h3>Jumbo Bouquet with Lily-Pin</h3>

                <div class="qty">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <p class="price">
                    Rs.1299.00
                    <span class="line">Rs.1399.00</span>
                </p>
            </div>

            <i class="fa-solid fa-trash"></i>
        </div>

        <div class="item">
            <img src="https://floreal.in/cdn/shop/files/2_16.webp?v=1777634297&width=600"  height="200" width="200">
            <div class="details">
                <h3>Lavender Tulip Bouquet</h3>

                <div class="qty">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <p class="price">
                    Rs.799.00
                    <span class="line">Rs.899.00</span>
                </p>
            </div>

            <i class="fa-solid fa-trash"></i>
        </div>

    </div>

    <div class="bottom">
        <div class="row">
            <p>Discount</p>
            <p>- Rs.1980.00</p>
        </div>

        <div class="row total">
            <h3>Subtotal</h3
